<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Bun Voyage</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../assets/images/products/burger-classic.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />

  <!-- Base -->
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/typography.css" />
  <!-- Components -->
  <link rel="stylesheet" href="../css/components/buttons.css" />
  <link rel="stylesheet" href="../css/components/forms.css" />
  <link rel="stylesheet" href="../css/components/toast.css" />
  <!-- Page -->
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/pages/admin.css" />
</head>

<body class="admin-auth">

  <main class="admin-login">

    <!-- ================= LEFT: brand panel ================= -->
    <section class="admin-login__side" aria-hidden="true">
      <a href="../index.html" class="admin-brand admin-brand--light">
        <img src="../assets/images/products/burger-classic.svg" alt="" width="44" height="44" />
        <span>Bun<span class="hl-red">Voyage</span></span>
        <span class="admin-brand__tag">Admin</span>
      </a>

      <div class="admin-login__hero">
        <h1>Kitchen<br /><span class="hl-box">Console</span></h1>
        <p>Accept orders, update the grill, and keep the burgers moving.</p>
      </div>

      <!-- decorative fake stats -->
      <ul class="admin-login__preview">
        <li class="mini-stat mini-stat--yellow">
          <span class="mini-stat__icon">🧾</span>
          <div><small>Orders today</small><strong>128</strong></div>
        </li>
        <li class="mini-stat mini-stat--red">
          <span class="mini-stat__icon">🔥</span>
          <div><small>On the grill</small><strong>12</strong></div>
        </li>
        <li class="mini-stat mini-stat--green">
          <span class="mini-stat__icon">💸</span>
          <div><small>Sales today</small><strong>₱24.8k</strong></div>
        </li>
      </ul>

      <img src="../assets/images/products/burger-double.svg" alt="" class="admin-login__burger anim-float" style="--rot:-10deg" />
    </section>

    <!-- ================= RIGHT: login form ================= -->
    <section class="admin-login__main">
      <div class="admin-login__card">
        <span class="eyebrow">🔒 Staff only</span>
        <h2>Admin sign in</h2>
        <p class="admin-login__sub">Use your staff account to open the dashboard.</p>

        <form id="adminLoginForm" novalidate onsubmit="return false">
          <div class="field">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" name="email" placeholder="admin@bunvoyage.com" autocomplete="username" required />
            <small class="field__error"></small>
          </div>

          <div class="field">
            <label for="adminPassword">Password</label>
            <div class="field__pw">
              <input type="password" id="adminPassword" name="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" aria-label="Show password">👁</button>
            </div>
            <small class="field__error"></small>
          </div>

          <p class="form-error" role="alert"></p>

          <button type="submit" class="btn btn--dark btn--block btn--lg">Open Dashboard →</button>

          <button type="button" class="demo-hint" id="adminDemoHint">
            Demo: <code>admin@bunvoyage.com</code> / <code>admin123</code> (click to fill)
          </button>
        </form>

        <a href="../index.html" class="link admin-login__back">← Back to the store</a>
      </div>
    </section>
  </main>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- ================= SCRIPTS ================= -->
  <script src="../js/data/products.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/ui/toast.js"></script>
  <script src="../js/pages/admin-login.js"></script>
</body>
</html>
