<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== Straw (behind the lid) ===== -->
    <g transform="rotate(14 232 70)">
      <rect x="220" y="4" width="24" height="120" rx="6" fill="#FFF4E0"/>
      <!-- red stripes -->
      <g fill="#FF4B3E" stroke-width="3">
        <path d="M222 22 L242 12 L242 26 L222 36 Z"/>
        <path d="M222 52 L242 42 L242 56 L222 66 Z"/>
        <path d="M222 82 L242 72 L242 86 L222 96 Z"/>
      </g>
    </g>

    <!-- ===== Cup ===== -->
    <path d="M104 116 H296 L270 378 Q200 392 130 378 Z" fill="#3B8EEA"/>

    <!-- cup shine -->
    <path d="M128 140 L148 360" fill="none" stroke="#8EC5FF" stroke-width="10"/>

    <!-- ===== Lid ===== -->
    <rect x="86" y="92" width="228" height="34" rx="12" fill="#FFF4E0"/>
    <path d="M120 92 Q200 66 280 92" fill="#FFF4E0"/>
    <!-- straw hole -->
    <ellipse cx="236" cy="84" rx="16" ry="6" fill="#1E1E1E" stroke="none"/>

    <!-- ===== Label ===== -->
    <path d="M118 196 H282 L274 286 H126 Z" fill="#FFF4E0"/>
    <text x="200" y="252"
          font-family="Archivo Black, Arial Black, Arial, sans-serif"
          font-size="40" font-weight="900"
          text-anchor="middle" fill="#FF4B3E"
          stroke="#1E1E1E" stroke-width="2" paint-order="stroke">FIZZ</text>
    <!-- little stars on label -->
    <g fill="#FFC233" stroke-width="2">
      <path d="M140 268 l4 8 l8 1 l-6 5 l2 8 l-8 -4 l-8 4 l2 -8 l-6 -5 l8 -1 Z"/>
      <path d="M260 268 l4 8 l8 1 l-6 5 l2 8 l-8 -4 l-8 4 l2 -8 l-6 -5 l8 -1 Z"/>
    </g>

    <!-- ===== Bubbles ===== -->
    <g fill="#8EC5FF" stroke-width="3">
      <circle cx="176" cy="164" r="8"/>
      <circle cx="210" cy="150" r="5"/>
      <circle cx="244" cy="170" r="7"/>
      <circle cx="190" cy="326" r="6"/>
      <circle cx="226" cy="344" r="8"/>
      <circle cx="250" cy="314" r="5"/>
    </g>

    <!-- ===== Condensation drops (outside the cup) ===== -->
    <g fill="#FFFFFF" stroke-width="3">
      <path d="M290 186 q6 10 0 16 q-6 -6 0 -16 Z"/>
      <path d="M282 300 q5 9 0 14 q-5 -5 0 -14 Z"/>
      <path d="M112 320 q5 9 0 14 q-5 -5 0 -14 Z"/>
    </g>
  </g>
</svg>