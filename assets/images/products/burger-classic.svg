<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370">
  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- Bottom bun -->
    <rect x="50" y="292" width="300" height="60" rx="28" fill="#F4A23A"/>

    <!-- Patty -->
    <rect x="40" y="238" width="320" height="62" rx="30" fill="#6B3A1F"/>

    <!-- Cheese (with drips) -->
    <path d="M45 228 H355 L342 250 L322 234 L304 266 L284 236 H136 L116 262 L96 236 L72 252 Z" fill="#FFC233"/>

    <!-- Tomato -->
    <rect x="58" y="204" width="284" height="30" rx="15" fill="#FF4B3E"/>

    <!-- Lettuce (wavy) -->
    <path d="M30 200 Q50 178 70 198 T110 198 T150 198 T190 198 T230 198 T270 198 T310 198 T350 198 Q362 190 370 200 L360 214 H40 Z" fill="#3BB273"/>

    <!-- Top bun -->
