    <!-- Bun shine -->
    <path d="M85 120 C100 85 140 65 175 62" fill="none" stroke="#FFD08A" stroke-width="10"/>

    <!-- Sesame seeds -->
    <g fill="#FFF4E0" stroke-width="3">
      <ellipse cx="140" cy="90"  rx="9" ry="5" transform="rotate(-20 140 90)"/>
      <ellipse cx="200" cy="70"  rx="9" ry="5"/>
      <ellipse cx="260" cy="92"  rx="9" ry="5" transform="rotate(20 260 92)"/>
      <ellipse cx="170" cy="125" rx="9" ry="5" transform="rotate(-10 170 125)"/>
      <ellipse cx="235" cy="125" rx="9" ry="5" transform="rotate(10 235 125)"/>
      <ellipse cx="110" cy="140" rx="9" ry="5" transform="rotate(-30 110 140)"/>
      <ellipse cx="292" cy="140" rx="9" ry="5" transform="rotate(30 292 140)"/>
    </g>
  </g>
</svg>