<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== Fries (drawn first so the box covers their bottoms) ===== -->
    <g fill="#FFC233">
      <rect x="104" y="58"  width="34" height="200" rx="6" transform="rotate(-14 121 158)"/>
      <rect x="146" y="34"  width="34" height="220" rx="6" transform="rotate(-5 163 144)"/>
      <rect x="190" y="22"  width="34" height="230" rx="6"/>
      <rect x="232" y="38"  width="34" height="214" rx="6" transform="rotate(7 249 145)"/>
      <rect x="270" y="62"  width="34" height="190" rx="6" transform="rotate(15 287 157)"/>
      <!-- back row, shorter -->
      <rect x="168" y="76"  width="30" height="170" rx="6" transform="rotate(-9 183 161)"/>
      <rect x="214" y="72"  width="30" height="176" rx="6" transform="rotate(10 229 160)"/>
    </g>

    <!-- Golden tips (toasty ends) -->
    <g fill="#E89A2E" stroke-width="4">
      <rect x="190" y="22" width="34" height="14" rx="6"/>
      <rect x="146" y="34" width="34" height="14" rx="6" transform="rotate(-5 163 144)"/>
      <rect x="232" y="38" width="34" height="14" rx="6" transform="rotate(7 249 145)"/>
    </g>

    <!-- ===== Box ===== -->
    <!-- inner back lip -->
    <path d="M82 172 Q200 140 318 172 L314 186 Q200 158 86 186 Z" fill="#D93A2F"/>

    <!-- front of box -->
    <path d="M80 170 Q200 236 320 170 L292 372 Q200 388 108 372 Z" fill="#FF4B3E"/>

    <!-- stripes -->
    <g fill="none" stroke="#FFF4E0" stroke-width="10" stroke-linecap="butt">
      <path d="M116 214 L132 360"/>
      <path d="M284 214 L268 360"/>
    </g>

    <!-- logo badge -->
    <circle cx="200" cy="290" r="44" fill="#FFF4E0"/>
    <circle cx="200" cy="290" r="32" fill="#FFC233" stroke-width="4"/>
    <!-- smile -->
    <path d="M182 290 Q200 312 218 290" fill="none" stroke-width="5"/>
    <circle cx="188" cy="278" r="4" fill="#1E1E1E" stroke="none"/>
    <circle cx="212" cy="278" r="4" fill="#1E1E1E" stroke="none"/>

    <!-- box shine -->
    <path d="M100 196 Q108 250 118 330" fill="none" stroke="#FF8A7A" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>