<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370">
  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- Bottom bun (red chili bun) -->
    <rect x="50" y="292" width="300" height="60" rx="28" fill="#E0412F"/>

    <!-- Patty (extra charred) -->
    <rect x="40" y="238" width="320" height="62" rx="30" fill="#4A2412"/>

    <!-- Grill marks -->
    <g stroke="#2A1309" stroke-width="5">
      <path d="M95 262 l18 18"/>
      <path d="M165 262 l18 18"/>
      <path d="M235 262 l18 18"/>
      <path d="M305 262 l18 18"/>
    </g>

    <!-- Pepper jack cheese (orange) -->
    <path d="M45 228 H355 L342 250 L322 234 L304 266 L284 236 H136 L116 262 L96 236 L72 252 Z" fill="#FF8A1F"/>

    <!-- Jalapeño slices -->
    <g fill="#3BB273">
      <circle cx="105" cy="214" r="16"/>
      <circle cx="165" cy="210" r="16"/>
      <circle cx="235" cy="214" r="16"/>
      <circle cx="295" cy="210" r="16"/>
    </g>
    <!-- jalapeño seeds -->
    <g fill="#FFF4E0" stroke-width="2">
      <circle cx="101" cy="212" r="3"/><circle cx="109" cy="217" r="3"/>
      <circle cx="161" cy="208" r="3"/><circle cx="169" cy="213" r="3"/>
      <circle cx="231" cy="212" r="3"/><circle cx="239" cy="217" r="3"/>
      <circle cx="291" cy="208" r="3"/><circle cx="299" cy="213" r="3"/>
    </g>

    <!-- Top bun (red chili bun) -->
    <path d="M40 185 C40 80 120 40 200 40 C280 40 360 80 360 185 Z" fill="#E0412F"/>

    <!-- Bun shine -->
    <path d="M85 120 C100 85 140 65 175 62" fill="none" stroke="#FF8A7A" stroke-width="10"/>

    <!-- Sesame seeds -->
    <g fill="#FFF4E0" stroke-width="3">
      <ellipse cx="140" cy="90"  rx="9" ry="5" transform="rotate(-20 140 90)"/>
      <ellipse cx="200" cy="70"  rx="9" ry="5"/>
      <ellipse cx="260" cy="92"  rx="9" ry="5" transform="rotate(20 260 92)"/>
      <ellipse cx="170" cy="125" rx="9" ry="5" transform="rotate(-10 170 125)"/>
      <ellipse cx="235" cy="125" rx="9" ry="5" transform="rotate(10 235 125)"/>
      <ellipse cx="110" cy="140" rx="9" ry="5" transform="rotate(-30 110 140)"/>
      <ellipse cx="292" cy="140" rx="9" ry="5" transform="rotate(30 292 140)"/>
    </g>

    <!-- Flame on top -->
    <path d="M200 6 C214 22 226 30 220 46 C232 40 236 30 234 22 C246 34 248 52 236 64 C224 76 176 76 164 64 C152 52 156 36 168 28 C168 38 174 44 180 46 C172 30 184 16 200 6 Z"
          fill="#FFC233"/>
    <path d="M200 34 C206 42 212 48 208 58 C204 64 196 64 192 58 C188 50 194 42 200 34 Z"
          fill="#FF4B3E" stroke-width="4"/>
  </g>
</svg>