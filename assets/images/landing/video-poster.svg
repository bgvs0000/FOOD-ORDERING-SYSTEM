<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- polka-dot pattern -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#1E1E1E" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="500" fill="#FFC233"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <!-- sunburst behind the grill -->
  <g transform="translate(400 300)" fill="#FFE08A">
    <path d="M0 0 L-60 -320 L60 -320 Z"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(30)"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(60)"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(90)"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(-30)"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(-60)"/>
    <path d="M0 0 L-60 -320 L60 -320 Z" transform="rotate(-90)"/>
  </g>

  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== Grill plate ===== -->
    <rect x="90" y="360" width="620" height="70" rx="14" fill="#2B2B2B"/>
    <rect x="70" y="420" width="660" height="40" rx="12" fill="#1E1E1E"/>
    <!-- grill shine -->
    <path d="M120 378 H300" stroke="#555" stroke-width="6"/>

    <!-- ===== Smashed patty on the grill ===== -->
    <ellipse cx="400" cy="356" rx="150" ry="26" fill="#6B3A1F"/>
    <!-- crispy lacy edge -->
    <path d="M250 356 q10 -14 22 -2 q12 -14 24 -2 M480 344 q12 -12 24 0 q12 -12 22 2"
          fill="none" stroke-width="5"/>

    <!-- melting cheese on top -->
    <path d="M300 340 H500 L488 356 L472 344 L456 366 L440 346 H360 L344 364 L328 346 L314 356 Z"
          fill="#FFC233"/>

    <!-- ===== Spatula pressing down ===== -->
    <g transform="rotate(-8 400 250)">
      <!-- blade -->
      <rect x="300" y="268" width="200" height="56" rx="10" fill="#E6E6E6"/>
      <g stroke-width="4">
        <path d="M330 280 V312"/>
        <path d="M360 280 V312"/>
        <path d="M390 280 V312"/>
      </g>
      <!-- neck -->
      <path d="M470 270 L520 200" fill="none" stroke-width="18"/>
      <path d="M470 270 L520 200" fill="none" stroke="#BDBDBD" stroke-width="8"/>
      <!-- handle -->
      <rect x="500" y="110" width="44" height="110" rx="20" fill="#FF4B3E"
            transform="rotate(35 522 165)"/>
    </g>

    <!-- ===== Sizzle lines ===== -->
    <g fill="none" stroke-width="6">
      <path d="M210 330 l-40 -20"/>
      <path d="M200 300 l-50 -6"/>
      <path d="M590 330 l40 -20"/>
      <path d="M600 300 l50 -6"/>
    </g>

    <!-- ===== Steam ===== -->
    <g fill="none" stroke="#FFF4E0" stroke-width="10">
      <path d="M260 230 q-20 -30 0 -60 q20 -30 0 -60"/>
      <path d="M540 220 q20 -30 0 -60 q-20 -30 0 -60"/>
    </g>

    <!-- ===== Title badge (top-right, clear of the play button) ===== -->
    <g transform="rotate(4 650 110)">
      <rect x="560" y="70" width="190" height="80" rx="16" fill="#FF4B3E"/>
      <text x="655" y="124"
            font-family="Archivo Black, Arial Black, Arial, sans-serif"
            font-size="34" font-weight="900"
            text-anchor="middle" fill="#FFF4E0"
            stroke="#1E1E1E" stroke-width="2" paint-order="stroke">SMASH!</text>
    </g>

    <!-- small sparkle stars -->
    <g fill="#FFF4E0" stroke-width="3">
      <path d="M120 120 l8 16 l16 2 l-12 10 l4 16 l-16 -8 l-16 8 l4 -16 l-12 -10 l16 -2 Z"/>
      <path d="M690 230 l6 12 l12 2 l-9 8 l3 12 l-12 -6 l-12 6 l3 -12 l-9 -8 l12 -2 Z"/>
    </g>
  </g>
</svg>