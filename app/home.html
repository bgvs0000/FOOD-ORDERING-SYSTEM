<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Bun Voyage</title>
  <link rel="icon" href="../assets/images/products/burger-classic.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />

  <!-- Base -->
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/typography.css" />
  <!-- Components -->
  <link rel="stylesheet" href="../css/components/buttons.css" />
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/components/cards.css" />
  <link rel="stylesheet" href="../css/components/forms.css" />
  <link rel="stylesheet" href="../css/components/toast.css" />
  <!-- Page -->
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/pages/app.css" />
  <link rel="stylesheet" href="../css/pages/home.css" />
</head>

<body class="app" data-page="home">

  <!-- Navbar (rendered by js/ui/navbar.js) -->
  <header class="app-nav" id="appNav"></header>

  <main class="app-main container">

    <!-- ================= GREETING / PROMO BANNER ================= -->
    <section class="promo-banner">
      <div class="promo-banner__copy">
        <p class="promo-banner__hi">Hi, <span id="userFirstName">friend</span> 👋</p>
        <h1>What are you <span class="hl-box">craving</span> today?</h1>
        <p>Use code <span class="code">FIRSTBITE</span> for 20% off your first order.</p>
      </div>
      <div class="promo-banner__visual">
        <div class="tilt promo-banner__burger" data-tilt data-tilt-max="14">
          <img src="../assets/images/products/burger-double.svg" alt="" class="tilt__img" />
          <span class="tilt__glare"></span>
        </div>
        <span class="promo-banner__tag anim-wiggle">20% OFF</span>
      </div>
    </section>

    <!-- ================= QUICK DEALS ================= -->
    <section class="deals" aria-label="Deals">
      <article class="deal deal--red">
        <span class="deal__emoji">🍔🍟</span>
        <div><strong>Combo Saver</strong><small>Burger + fries + drink</small></div>
        <span class="deal__price">₱249</span>
      </article>
      <article class="deal deal--yellow">
        <span class="deal__emoji">🛵</span>
        <div><strong>Free Delivery</strong><small>On orders ₱500+</small></div>
        <span class="deal__price">₱0</span>
      </article>
      <article class="deal deal--green">
        <span class="deal__emoji">⚡</span>
        <div><strong>Express</strong><small>Under 25 minutes</small></div>
        <span class="deal__price">FAST</span>
      </article>
    </section>

    <!-- ================= TOOLBAR: SEARCH + SORT ================= -->
    <section class="menu-toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="Search burgers, fries, drinks..." aria-label="Search menu" />
      </div>

      <select id="sortSelect" class="select" aria-label="Sort products">
        <option value="popular">Most popular</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="rating">Top rated</option>
      </select>
    </section>

    <!-- ================= CATEGORY CHIPS ================= -->
    <!-- Chips are generated by js/pages/home.js from categories in products.js -->
    <nav class="chips" id="categoryChips" aria-label="Categories"></nav>

    <!-- ================= PRODUCT GRID ================= -->
    <section aria-live="polite">
      <div class="grid-head">
        <h2 id="gridTitle">All Items</h2>
        <span class="grid-count" id="gridCount">0 items</span>
      </div>

      <div class="product-grid" id="productGrid">
        <!-- skeleton loaders (pinapalitan ng JS) -->
        <div class="product-card skeleton"></div>
        <div class="product-card skeleton"></div>
        <div class="product-card skeleton"></div>
        <div class="product-card skeleton"></div>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState" hidden>
        <img src="../assets/images/products/burger-spicy.svg" alt="" class="anim-wiggle" />
        <h3>No burgers found</h3>
        <p>Try a different search or category.</p>
        <button class="btn btn--sm" id="clearFilters">Clear filters</button>
      </div>
    </section>
  </main>

  <!-- Floating cart button (mobile) -->
  <a href="cart.html" class="fab-cart" id="fabCart" aria-label="View cart">
    🛒 <span>View Cart</span>
    <strong class="fab-cart__total" id="fabTotal">₱0</strong>
  </a>

  <!-- Bottom nav (mobile, rendered by navbar.js) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile"></nav>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- ================= SCRIPTS ================= -->
  <script src="../js/data/products.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/auth.js"></script>
  <script>Auth.guard();</script> <!-- bounce to landing if not logged in -->
  <script src="../js/core/cart.js"></script>
  <script src="../js/ui/toast.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/tilt3d.js"></script>
  <script src="../js/effects/scrollReveal.js"></script>
  <script src="../js/pages/home.js"></script>
</body>
</html>
